# Solarized Dark. Sourced by the client-dark-theme hook in ~/.tmux.conf.
# Runs after tpm, so these win over the plugin's own values.
source-file ~/.tmux/plugins/tmux-colors-solarized/tmuxcolors-dark.conf

# Dim inactive panes: only the focused pane keeps full-contrast text.
# Explicit hex rather than palette slots — base02 (#073642) is only a ~3% step
# from base03 and was too close to see. #0d4250 widens it to ~9%.
# Mirrors light.conf: inactive text drops one tone (base0 -> base01), and the
# inactive backdrop moves away from the terminal background in both themes.
# 'terminal', not 'default': per tmux STYLES, 'default' inherits the default
# style — i.e. window-style — so the active pane would pick up the dim backdrop
# and both panes would look identical. 'terminal' is the real terminal default.
set -g window-active-style 'fg=terminal,bg=terminal'  # base03 #002b36 from ghostty
set -g window-style        'fg=#586e75,bg=#0d4250'  # base01 text, dimmed backdrop

# Borders match the inactive pane, so only the focused pane stands out.
set -g pane-border-style        'fg=#586e75,bg=#0d4250'
set -g pane-active-border-style 'fg=#586e75,bg=#0d4250'

set-window-option -g window-status-current-style fg=colour148
set-window-option -g window-status-style fg=colour9

# Publish the mode and nudge nvim — this is the path that makes flips from
# System Settings (or the macOS auto schedule) reach the editor.
run-shell -b 'printf "dark\n" > ~/.cache/theme-mode; pkill -USR1 -x nvim 2>/dev/null || true'
