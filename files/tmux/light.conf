# Solarized Light. Sourced by the client-light-theme hook in ~/.tmux.conf.
# Runs after tpm, so these win over the plugin's own values.
source-file ~/.tmux/plugins/tmux-colors-solarized/tmuxcolors-light.conf

# Dim inactive panes: only the focused pane keeps full-contrast text.
# Explicit hex rather than palette slots — base2 (#eee8d5) is only a ~3% step
# from base3 and was too close to see. #e6dec6 widens it to ~9%.
# 'terminal', not 'default': per tmux STYLES, 'default' inherits the default
# style — i.e. window-style — so the active pane would pick up the dim backdrop
# and both panes would look identical. 'terminal' is the real terminal default.
set -g window-active-style 'fg=terminal,bg=terminal'  # base3 #fdf6e3 from ghostty
set -g window-style        'fg=#93a1a1,bg=#e6dec6'  # base1 text, dimmed backdrop

# Invisible borders: fg == bg, so the glyphs vanish and the separator reads as a
# blank gap in the inactive backdrop. tmux always reserves the border row/column
# (pane-border-lines has no 'none'), so hiding the line is the most we can do.
set -g pane-border-style        'fg=#e6dec6,bg=#e6dec6'
set -g pane-active-border-style 'fg=#e6dec6,bg=#e6dec6'

set-window-option -g window-status-current-style fg=colour148
set-window-option -g window-status-style fg=colour9

# Publish the mode, repaint fzf and nudge nvim — this is the path that makes flips
# from System Settings (or the macOS auto schedule) reach the editor and the shells.
# fzf-theme re-derives the mode itself, so it needs no argument and is idempotent.
run-shell -b 'printf "light\n" > ~/.cache/theme-mode; ~/.local/bin/fzf-theme; pkill -USR1 -x nvim 2>/dev/null || true'
