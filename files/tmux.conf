set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'seebi/tmux-colors-solarized'

set -g @resurrect-processes 'false'

set -g @continuum-restore 'on'

set -g base-index 1
set-option -g focus-events on

# set -g default-terminal screen-256color
# set-option -sa terminal-overrides ',xterm-256color:RGB'
# set-option -sa terminal-overrides ",xterm*:RGB"
# set-option -g default-terminal "tmux-256color"
# set -as terminal-features ",*:RGB"

# Add truecolor support
set-option -ga terminal-overrides ",xterm-256color:Tc"
# Default terminal is 256 colors
set -g default-terminal "screen-256color"

# Baseline only, for the moment between tpm running and the first client
# attaching (unset here, the plugin would fall back to its '256' variant).
# The real value comes from the client-*-theme hooks at the bottom of this file,
# which source ~/.config/tmux/{light,dark}.conf to follow the terminal.
set -g @colors-solarized 'light'

set -g default-command "${SHELL}"

set -g visual-activity off
setw -g monitor-activity off

set-window-option -g aggressive-resize
set -ga word-separators " .,:·-_#{}()[]"

set -g status-keys vi
setw -g mode-keys vi

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 15
bind-key K resize-pane -U 15
bind-key H resize-pane -L 15
bind-key L resize-pane -R 15

# Vim style pane selection
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key X kill-session

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

bind-key c command-prompt -p "Enter new window name:" "new-window -c '#{pane_current_path}'; rename-window '%%'"
set -g automatic-rename off

# Reload tmux config
bind r source-file ~/.tmux.conf

# Toggle the whole stack (terminal, tmux, nvim, bat) light <-> dark.
# Absolute path: the tmux server's PATH may predate ~/.local/bin.
# -b so the ~200ms osascript doesn't block the server.
bind-key T run-shell -b '$HOME/.local/bin/theme-toggle'

# Status bar options
set-option -g status-position top
# set -g status-interval 300
set -g status-left-length 100
# set -g status-left "#[fg=colour6]#S #[fg=colour199]#(whoami) #[fg=blue]#(curl -4 icanhazip.com) "
set -g status-left "#[fg=colour6]#S #[fg=blue]#(whoami) "

set -g status-right-length 100
# set -g status-right '#[fg=red]#{sysstat_cpu} #[fg=colour70]#{sysstat_mem} #[fg=colour148]#{sysstat_swap} #[fg=blue]#(date +"%H:%M %d %b %Y")'
# set -g status-right '#[fg=red]#{sysstat_cpu} #[fg=colour70]#{sysstat_mem} #[fg=colour148]#{sysstat_swap}'
set -g status-right ''
# window-status colors live in ~/.config/tmux/{light,dark}.conf — set here they
# would be overridden by tmux-colors-solarized, which runs later via tpm.

bind P paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi c-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
# for mac os
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
# for linux
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set -sg escape-time 0
run '~/.tmux/plugins/tpm/tpm'

# Follow the terminal's light/dark appearance (tmux 3.6, DEC mode 2031).
# Must stay after tpm — the theme files override tmux-colors-solarized.
#
# All three hooks run the same resolver rather than sourcing a specific conf:
# one appearance change can fire BOTH client-light-theme and client-dark-theme
# (several clients, several reports per transition), so acting on the hook's
# identity is a race. tmux-theme-apply re-reads the macOS appearance instead,
# which makes every firing idempotent.
set-hook -g client-light-theme 'run-shell -b "$HOME/.local/bin/tmux-theme-apply"'
set-hook -g client-dark-theme  'run-shell -b "$HOME/.local/bin/tmux-theme-apply"'
set-hook -g client-attached    'run-shell -b "$HOME/.local/bin/tmux-theme-apply"'
